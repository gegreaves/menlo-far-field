[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menlo-far-field-thz"
version = "0.1.0"
description = "Tools for THz spectroscopy data analysis using data from Menlo THz-TDS SmartScan"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]